name: Build VST3
on:
  push:
  workflow_dispatch:
jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Sign and zip
        run: |
          P=$(find build -type d -name "InfiniteSynth.vst3" | head -n 1)
          echo "Found: $P"
          codesign --force --deep -s - "$P"
          ditto -c -k --keepParent "$P" InfiniteSynth-VST3-mac.zip
      - uses: actions/upload-artifact@v4
        with:
          name: InfiniteSynth-VST3-mac
          path: InfiniteSynth-VST3-mac.zip
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -B build -G "Visual Studio 17 2022" -A x64
      - run: cmake --build build --config Release
      - uses: actions/upload-artifact@v4
        with:
          name: InfiniteSynth-VST3-windows
          path: build/InfiniteSynth_artefacts/Release/VST3/
