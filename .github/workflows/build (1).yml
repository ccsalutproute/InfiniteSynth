name: Build VST3
on:
  push:
  workflow_dispatch:
jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix editor (division by zero)
        run: |
          echo "=== Source folder ==="
          ls -la Source
          echo "=== BEFORE ==="
          grep -n "setSize\|knobs.empty" Source/PluginEditor.cpp || true
          python3 - <<'PY'
          p = 'Source/PluginEditor.cpp'
          s = open(p).read()
          s = s.replace("    setSize (780, 560);\n\n    title.setFont", "    title.setFont", 1)
          if "en dernier" not in s:
              s = s.replace("    timerCallback();\n}", "    timerCallback();\n    setSize (780, 560);   // en dernier : les potards existent deja\n}", 1)
          if "knobs.empty()" not in s:
              s = s.replace("void InfiniteEditor::resized()\n{\n", "void InfiniteEditor::resized()\n{\n    if (knobs.empty()) return;\n\n", 1)
          open(p, 'w').write(s)
          PY
          echo "=== AFTER ==="
          grep -n "setSize\|knobs.empty" Source/PluginEditor.cpp
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Sign and zip
        run: |
          P=$(find build -type d -name "InfiniteSynth.vst3" | head -n 1)
          echo "Found: $P"
          codesign --force --deep -s - "$P"
          ditto -c -k --keepParent "$P" InfiniteSynth-VST3-mac.zip
      - uses: actions/upload-artifact@v4
        with:
          name: InfiniteSynth-VST3-mac-fixed
          path: InfiniteSynth-VST3-mac.zip
